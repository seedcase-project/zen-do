context:
  version: "0.14.2"

package:
  name: zen-do
  version: ${{ version }}

source:
  url: https://github.com/seedcase-project/zen-do/archive/refs/tags/${{ version }}.tar.gz
  sha256: 221730b1007a8cb4aa69f4b7a0bd1bd07e732c6326087ca23b2b32b5bc41a320

build:
  script:
    - cargo-bundle-licenses --format yaml --output ${SRC_DIR}/THIRDPARTY.yml
    - $BUILD_PREFIX/bin/cargo install --locked --bins --root ${PREFIX} --path .

requirements:
  build:
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses

about:
  homepage: https://github.com/seedcase-project/zen-do
  license: MIT
  license_file:
    - LICENSE.md
    - THIRDPARTY.yml
  description: "A utility for managing cargo dependencies from the command line."
  summary: "A utility for managing cargo dependencies from the command line."
