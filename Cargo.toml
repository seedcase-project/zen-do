[package]
name = "zen-do"
version = "0.1.0"
edition = "2024"
authors = [
  "Luke W. Johnston <lwjohnst@gmail.com>",
  "Fruzsina Vago <fruzsi.vago@gmail.com>",
]
description = "Zenodo tasks from the command-line"
readme = "README.md"
homepage = "https://zen-do.seedcase-project.org"
repository = "https://github.com/seedcase-project/zen-do"
license = "MIT"
keywords = [
  "zenodo-api",
  "zenodo",
  "continuous-deployment",
  "dissemination",
  "open-science",
]
# From https://crates.io/category_slugs
categories = ["command-line-utilities"]
# Only include these files (LICENSE and Cargo.toml are always included).
include = ["src/*.rs", "CHANGELOG.md", "README.md", "CITATION.cff"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[lints.clippy]
# Needs to have priority set to indicate the order. `-1` means first.
pedantic = { priority = -1, level = "warn" }
unwrap-used = "deny"
